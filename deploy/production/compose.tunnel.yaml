services:
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4}
    # Official image runs as UID/GID 65532; the protected token file must be readable by it.
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel-token"]
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${VERIFIER_TUNNEL_TOKEN_FILE:?Set VERIFIER_TUNNEL_TOKEN_FILE to the protected token file}:/run/secrets/tunnel-token:ro
    logging:
      options:
        max-size: 20m
        max-file: "5"
